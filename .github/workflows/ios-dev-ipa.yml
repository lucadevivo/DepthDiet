name: iOS dev-client IPA (unsigned)

# Costruisce un IPA dev-client NON firmato su runner macOS gratuito.
# L'IPA si installa sull'iPhone con SideStore (ri-firma con Apple ID free);
# il JS viene caricato da Metro sul PC via LAN. Rebuild solo quando cambiano
# i moduli nativi. Trigger manuale dalla tab Actions di GitHub.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS deps
        run: npm install --legacy-peer-deps

      - name: Expo prebuild (genera progetto iOS + pods)
        run: npx expo prebuild --platform ios
        env:
          # Niente segreti nel guscio nativo: il JS arriva da Metro.
          CI: "1"

      - name: Individua workspace e scheme
        id: xc
        run: |
          set -euo pipefail
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -1)
          echo "Workspace trovato: [$WORKSPACE]"
          echo "--- xcodebuild -list ---"
          xcodebuild -list -workspace "$WORKSPACE" || true
          # Scheme dell'app: il primo diverso da "Pods", via output JSON.
          SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" \
            | python3 -c "import json,sys; s=json.load(sys.stdin).get('workspace',{}).get('schemes',[]); print(next((x for x in s if x!='Pods'), s[0] if s else ''))")
          # Fallback: nome del workspace senza estensione.
          if [ -z "$SCHEME" ]; then
            SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          fi
          echo "Scheme scelto: [$SCHEME]"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build Debug per device, senza firma
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "${{ steps.xc.outputs.workspace }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            build 2>&1 | tee xcodebuild.log

      - name: Carica i log (anche se fallisce)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            mobile/xcodebuild.log
            mobile/ios/Podfile
            mobile/ios/Podfile.lock
          if-no-files-found: warn

      - name: Impacchetta in .ipa
        run: |
          set -eo pipefail
          APP=$(ls -d build/Build/Products/Debug-iphoneos/*.app | head -1)
          echo "App: $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          ipa_name="food-tracker-devclient.ipa"
          zip -ry "$ipa_name" Payload >/dev/null
          echo "Creato $ipa_name"
          ls -lh "$ipa_name"

      - name: Carica l'IPA come artifact
        uses: actions/upload-artifact@v4
        with:
          name: food-tracker-devclient-ipa
          path: mobile/food-tracker-devclient.ipa
          if-no-files-found: error
